laser_filter:
  ros__parameters:
    filter1:
      name: box_filter
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link

        max_x: 0.4525
        min_x: -0.4525 # 0.165 + 0.03 (wifi antenna) + 0.05 (lidar uncertanity)

        max_y: 0.35
        min_y: -0.35

        max_z: 2.0
        min_z: 0.0

        invert: false 